<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shizuoka Fuji 3776 API Tool</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17342d;
        --muted: #62746f;
        --paper: #f5f1e8;
        --panel: #fffdf7;
        --line: #d8d3c7;
        --accent: #e85d35;
        --accent-dark: #bd3e1d;
        --success: #176b4d;
        --error: #a52a2a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 15%, rgba(232, 93, 53, 0.14), transparent 28rem),
          repeating-linear-gradient(90deg, transparent 0 47px, rgba(23, 52, 45, 0.035) 48px),
          var(--paper);
        font-family: "Avenir Next", "Hiragino Sans", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 64px 0;
      }

      header { margin-bottom: 28px; }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Yu Mincho", serif;
        font-size: clamp(34px, 7vw, 64px);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .description {
        max-width: 580px;
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .panel {
        padding: clamp(22px, 5vw, 40px);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(23, 52, 45, 0.08);
      }

      form { display: grid; gap: 22px; }

      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        font: inherit;
      }

      input:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(232, 93, 53, 0.16);
      }

      .numbers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 4px;
      }

      button {
        padding: 13px 22px;
        color: white;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { background: var(--accent-dark); }
      button:disabled { cursor: wait; opacity: 0.6; }

      #status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      #status[data-type="success"] { color: var(--success); }
      #status[data-type="error"] { color: var(--error); }

      .api-link {
        display: inline-block;
        margin-top: 22px;
        color: var(--ink);
        text-underline-offset: 4px;
      }

      @media (max-width: 560px) {
        main { padding: 38px 0; }
        .numbers { grid-template-columns: 1fr; }
        .actions { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">API playground</p>
        <h1>Fuji 3776</h1>
        <p class="description">
          APIが返すキャンペーン値を編集します。保存にはVercelで設定した編集トークンが必要です。
        </p>
      </header>

      <section class="panel">
        <form id="editor">
          <label>
            Campaign ID
            <input id="campaignId" name="campaignId" type="text" maxlength="200" required>
          </label>

          <div class="numbers">
            <label>
              Total likes
              <input id="totalLikes" name="totalLikes" type="number" min="0" step="1" required>
            </label>

            <label>
              Total posts
              <input id="totalPosts" name="totalPosts" type="number" min="0" step="1" required>
            </label>
          </div>

          <label>
            Edit token
            <input id="editToken" name="editToken" type="password" autocomplete="current-password" required>
          </label>

          <div class="actions">
            <button id="save" type="submit">Save values</button>
            <p id="status" role="status" aria-live="polite">現在値を読み込んでいます...</p>
          </div>
        </form>

        <a class="api-link" href="/api/shizuoka-fuji3776" target="_blank" rel="noreferrer">
          APIレスポンスを開く
        </a>
      </section>
    </main>

    <script>
      const apiUrl = "/api/shizuoka-fuji3776";
      const form = document.querySelector("#editor");
      const saveButton = document.querySelector("#save");
      const status = document.querySelector("#status");

      function showStatus(message, type = "") {
        status.textContent = message;
        status.dataset.type = type;
      }

      function populate(value) {
        form.elements.campaignId.value = value.campaignId;
        form.elements.totalLikes.value = value.totalLikes;
        form.elements.totalPosts.value = value.totalPosts;
      }

      async function readCurrentValue() {
        try {
          const response = await fetch(apiUrl, { cache: "no-store" });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || "現在値を取得できませんでした。");
          }

          populate(body);
          showStatus("現在値を読み込みました。", "success");
        } catch (error) {
          showStatus(error.message, "error");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;
        showStatus("保存しています...");

        const value = {
          campaignId: form.elements.campaignId.value,
          totalLikes: Number(form.elements.totalLikes.value),
          totalPosts: Number(form.elements.totalPosts.value)
        };

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${form.elements.editToken.value}`
            },
            body: JSON.stringify(value)
          });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || "保存できませんでした。");
          }

          populate(body);
          showStatus("保存しました。APIへ反映されています。", "success");
        } catch (error) {
          showStatus(error.message, "error");
        } finally {
          saveButton.disabled = false;
        }
      });

      readCurrentValue();
    </script>
  </body>
</html>
