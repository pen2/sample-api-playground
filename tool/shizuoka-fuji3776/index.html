<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shizuoka Fuji 3776 API Tool</title>
    <style>
      :root {
        color-scheme: light;
        --text: #222;
        --muted: #666;
        --border: #ddd;
        --blue: #06c;
        --blue-hover: #0052a3;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--text);
        background: #f7f7f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      main {
        width: min(640px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header { margin-bottom: 20px; }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }

      .description {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .panel {
        padding: 24px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      form { display: grid; gap: 18px; }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 9px 10px;
        color: var(--text);
        background: #fff;
        border: 1px solid #bbb;
        border-radius: 4px;
        font: inherit;
      }

      input:focus {
        border-color: var(--blue);
        outline: 2px solid rgba(0, 102, 204, 0.15);
      }

      .numbers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        padding: 9px 16px;
        color: white;
        background: var(--blue);
        border: 0;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover { background: var(--blue-hover); }
      button:disabled { cursor: wait; opacity: 0.6; }

      #status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      #status[data-type="success"] { color: var(--blue); }
      #status[data-type="error"] { color: var(--text); font-weight: 600; }

      .api-link {
        display: inline-block;
        margin-top: 18px;
        color: var(--blue);
      }

      @media (max-width: 560px) {
        main { padding: 24px 0; }
        .panel { padding: 18px; }
        .numbers { grid-template-columns: 1fr; }
        .actions { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Shizuoka Fuji 3776 API設定</h1>
        <p class="description">APIが返すキャンペーン値を編集します。</p>
      </header>

      <section class="panel">
        <form id="editor">
          <input
            id="editToken"
            name="editToken"
            type="hidden"
            value="1784d2bc9a2f4872b8b5223d9a8df11f46651482601ff6ea"
          >

          <label>
            Campaign ID
            <input id="campaignId" name="campaignId" type="text" maxlength="200" required>
          </label>

          <div class="numbers">
            <label>
              Total likes
              <input id="totalLikes" name="totalLikes" type="number" min="0" step="1" required>
            </label>

            <label>
              Total posts
              <input id="totalPosts" name="totalPosts" type="number" min="0" step="1" required>
            </label>
          </div>

          <div class="actions">
            <button id="save" type="submit">保存</button>
            <p id="status" role="status" aria-live="polite">現在値を読み込んでいます...</p>
          </div>
        </form>

        <a class="api-link" href="/api/shizuoka-fuji3776" target="_blank" rel="noreferrer">
          APIレスポンスを開く
        </a>
      </section>
    </main>

    <script>
      const apiUrl = "/api/shizuoka-fuji3776";
      const form = document.querySelector("#editor");
      const saveButton = document.querySelector("#save");
      const status = document.querySelector("#status");

      function showStatus(message, type = "") {
        status.textContent = message;
        status.dataset.type = type;
      }

      function populate(value) {
        form.elements.campaignId.value = value.campaignId;
        form.elements.totalLikes.value = value.totalLikes;
        form.elements.totalPosts.value = value.totalPosts;
      }

      async function readCurrentValue() {
        try {
          const response = await fetch(apiUrl, { cache: "no-store" });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || "現在値を取得できませんでした。");
          }

          populate(body);
          showStatus("現在値を読み込みました。", "success");
        } catch (error) {
          showStatus(error.message, "error");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;
        showStatus("保存しています...");

        const value = {
          campaignId: form.elements.campaignId.value,
          totalLikes: Number(form.elements.totalLikes.value),
          totalPosts: Number(form.elements.totalPosts.value)
        };

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${form.elements.editToken.value}`
            },
            body: JSON.stringify(value)
          });
          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || "保存できませんでした。");
          }

          populate(body);
          showStatus("保存しました。APIへ反映されています。", "success");
        } catch (error) {
          showStatus(error.message, "error");
        } finally {
          saveButton.disabled = false;
        }
      });

      readCurrentValue();
    </script>
  </body>
</html>
